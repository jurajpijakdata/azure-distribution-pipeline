# Runs on every push to main and on every pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Install Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Code style (ruff)
        run: ruff check .

      - name: Generator tests (pytest)
        run: pytest

      - name: dbt project is valid (dbt parse)
        working-directory: dbt
        run: dbt parse
      
            - name: Alert Discord if anything failed
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: >
          python scripts/notify_discord.py
          "🔴 CI failed on ${GITHUB_REF_NAME} (commit ${GITHUB_SHA::7}):
          ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"