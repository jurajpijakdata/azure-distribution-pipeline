# Connection settings for dbt. No password: dbt uses your `az login` identity.
distribution:
  target: dev
  outputs:
    dev:
      type: sqlserver
      driver: 'ODBC Driver 18 for SQL Server'
      server: sql-distpipeline-jp.database.windows.net
      port: 1433
      database: free-sql-db-8791495
      schema: dbt_dev
      authentication: CLI
      encrypt: true
      trust_cert: false
      threads: 4